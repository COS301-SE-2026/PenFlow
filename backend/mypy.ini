[mypy]
python_version = 3.12
strict = True
disallow_untyped_decorators = False

[mypy-weasyprint.*]
ignore_missing_imports = True

[mypy-celery.*]
ignore_missing_imports = True

[mypy-app.models.*]
disable_error_code = var-annotated

[mypy-app.repositories.*]
disable_error_code = assignment,index

[mypy-app.api.routes.*]
disable_error_code = assignment