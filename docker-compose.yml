services:
  frontend:
    container_name: penflow-frontend
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - penflow-network

  backend-test:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend.test
    environment:
      DATABASE_URL: postgresql://${POSTGRES_TEST_USER}:${POSTGRES_TEST_PASSWORD}@postgres-test:5432/${POSTGRES_TEST_DB}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
      REDIS_URL: redis://redis:6379/1
      REPORT_OUTPUT_DIR: /app/generated_reports
      SCREENSHOT_OUTPUT_DIR: /app/generated_reports/screenshots
    depends_on:
      postgres-test:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - report-files-test:/app/generated_reports
    networks:
      - penflow-network

  backend:
    container_name: penflow-backend
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "3001:3001"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REPORT_OUTPUT_DIR: /app/generated_reports
      SCREENSHOT_OUTPUT_DIR: /app/generated_reports/screenshots
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - report-files:/app/generated_reports
    restart: unless-stopped
    networks:
      - penflow-network

  workers-test:
    build:
      context: .
      dockerfile: docker/Dockerfile.workers.test
    environment:
      BACKEND_API_URL: http://backend:3001/api/v1
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL: postgresql://${POSTGRES_TEST_USER}:${POSTGRES_TEST_PASSWORD}@postgres-test:5432/${POSTGRES_TEST_DB}
      REPORT_OUTPUT_DIR: /app/generated_reports
      SCREENSHOT_OUTPUT_DIR: /app/generated_reports/screenshots
    depends_on:
      postgres-test:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - report-files-test:/app/generated_reports
    networks:
      - penflow-network
    command: ["celery", "-A", "app.queue.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=7"]

  workers:
    container_name: penflow-workers
    build:
      context: .
      dockerfile: docker/Dockerfile.workers
    environment:
      BACKEND_API_URL: http://backend:3001/api/v1
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      URLSCAN_API_KEY: ${URLSCAN_API_KEY}
      SHODAN_API_KEY: ${SHODAN_API_KEY}
      REPORT_OUTPUT_DIR: /app/generated_reports
      SCREENSHOT_OUTPUT_DIR: /app/generated_reports/screenshots
      SCAN_MODE: LIVE
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - report-files:/app/generated_reports
    restart: unless-stopped
    networks:
      - penflow-network

  rabbitmq:
    container_name: penflow-rabbitmq
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - penflow-network

  redis:
    container_name: penflow-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - penflow-network

  postgres:
    container_name: penflow-postgres
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - penflow-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - penflow-network

  postgres-test:
    container_name: penflow-postgres-test
    image: postgres:16-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_TEST_USER} -d ${POSTGRES_TEST_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD}
      POSTGRES_DB: ${POSTGRES_TEST_DB}
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    restart: "no"
    networks:
      - penflow-network

networks:
  penflow-network:
    driver: bridge

volumes:
  penflow-postgres-data:
  report-files:
  report-files-test: