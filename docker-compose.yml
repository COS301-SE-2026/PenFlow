services:
  frontend:
    container_name: penflow-frontend
    image: ${FRONTEND_IMAGE:-penflow-frontend:local}
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      API_URL: http://backend:3001
      APP_URL: http://localhost:3000
      CLIENT_IP_SOURCE: local
      RATE_LIMIT_PROXY_SECRET: ${RATE_LIMIT_PROXY_SECRET:-local-only-rate-limit-proxy-secret-change-for-production}
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: penflow
      KEYCLOAK_CLIENT_ID: penflow-web
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
    depends_on:
      backend:
        condition: service_started
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - penflow-network

  backend-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: docker/Dockerfile.backend.test
    environment:
      DATABASE_URL: postgresql://${POSTGRES_TEST_USER}:${POSTGRES_TEST_PASSWORD}@postgres-test:5432/${POSTGRES_TEST_DB}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_PROTOCOL: amqp
      APP_ENV: test
      DATABASE_SSL_MODE: disable
      RATE_LIMIT_STORAGE_URI: redis://redis:6379/1
      INTERNAL_WEBHOOK_SECRET: ${INTERNAL_WEBHOOK_SECRET:?Set INTERNAL_WEBHOOK_SECRET in .env}
      SCREENSHOT_OUTPUT_DIR: /app/generated_reports/screenshots
      EVIDENCE_STORAGE: local
      EVIDENCE_STORAGE_DIR: /tmp/penflow-evidence-test
      REPORT_STORAGE: local
      REPORT_OUTPUT_DIR: /app/generated_reports
      GUEST_SCAN_TOKEN_SECRET: ${GUEST_SCAN_TOKEN_SECRET:?Set GUEST_SCAN_TOKEN_SECRET}
    depends_on:
      postgres-test:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - report-files-test:/app/generated_reports
    networks:
      - penflow-network

  backend:
    container_name: penflow-backend
    image: ${BACKEND_IMAGE:-penflow-backend:local}
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "3001:3001"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_PROTOCOL: amqp
      APP_ENV: development
      DATABASE_SSL_MODE: disable
      RATE_LIMIT_STORAGE_URI: redis://redis:6379/0
      RATE_LIMIT_PROXY_SECRET: ${RATE_LIMIT_PROXY_SECRET:-local-only-rate-limit-proxy-secret-change-for-production}
      DATABASE_URL: postgresql://penflow_runtime:${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB}
      KEYCLOAK_ISSUER: http://localhost:8080/realms/penflow
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/penflow/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: penflow-api
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_REALM: penflow
      KEYCLOAK_PROVISIONER_CLIENT_ID: penflow-user-provisioner
      KEYCLOAK_PROVISIONER_CLIENT_SECRET: ${KEYCLOAK_PROVISIONER_CLIENT_SECRET}
      KEYCLOAK_INVITE_CLIENT_ID: penflow-web
      KEYCLOAK_INVITE_REDIRECT_URI: http://localhost:3000/login
      SCREENSHOT_OUTPUT_DIR: /app/generated_reports/screenshots
      CORS_ORIGINS: http://localhost:3000
      EVIDENCE_STORAGE: local
      EVIDENCE_STORAGE_DIR: /tmp/penflow-evidence
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      REPORT_STORAGE: ${REPORT_STORAGE:-local}
      REPORT_OUTPUT_DIR: ${REPORT_OUTPUT_DIR:-/app/generated_reports}
      REPORT_S3_BUCKET: ${REPORT_S3_BUCKET:-}
      INTERNAL_WEBHOOK_SECRET: ${INTERNAL_WEBHOOK_SECRET:?INTERNAL_WEBHOOK_SECRET must be set in your .env file}
      AWS_REGION: ${AWS_REGION:-af-south-1}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai_compatible}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      BEDROCK_REGION: ${BEDROCK_REGION:-}
      BEDROCK_EMBEDDING_MODEL_ID: ${BEDROCK_EMBEDDING_MODEL_ID:-amazon.titan-embed-text-v2:0}
      BEDROCK_EMBEDDING_DIMENSIONS: ${BEDROCK_EMBEDDING_DIMENSIONS:-1024}
      GENERATION_PROVIDER: ${GENERATION_PROVIDER:-bedrock}
      BEDROCK_GENERATION_REGION: ${BEDROCK_GENERATION_REGION:-}
      BEDROCK_GENERATION_MODEL_ID: ${BEDROCK_GENERATION_MODEL_ID:-}
      BEDROCK_GENERATION_MAX_TOKENS: ${BEDROCK_GENERATION_MAX_TOKENS:-800}
      BEDROCK_GENERATION_TEMPERATURE: ${BEDROCK_GENERATION_TEMPERATURE:-0.1}
      GUEST_SCAN_TOKEN_SECRET: ${GUEST_SCAN_TOKEN_SECRET:?Set GUEST_SCAN_TOKEN_SECRET}

    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    volumes:
      - report-files:/app/generated_reports
      - evidence-files:/tmp/penflow-evidence
    restart: unless-stopped
    networks:
      - penflow-network

  workers-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: docker/Dockerfile.workers.test
    environment:
      BACKEND_URL: http://backend:3001
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_PROTOCOL: amqp
      DATABASE_SSL_MODE: disable
      DATABASE_URL: postgresql://${POSTGRES_TEST_USER}:${POSTGRES_TEST_PASSWORD}@postgres-test:5432/${POSTGRES_TEST_DB}
      INTERNAL_WEBHOOK_SECRET: ${INTERNAL_WEBHOOK_SECRET:?Set INTERNAL_WEBHOOK_SECRET in .env}
      SCREENSHOT_OUTPUT_DIR: /app/generated_reports/screenshots
      SCAN_MODE: MOCK
      REPORT_STORAGE: local
      REPORT_OUTPUT_DIR: /app/generated_reports
    depends_on:
      postgres-test:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - report-files-test:/app/generated_reports
    networks:
      - penflow-network
    command: ["celery", "-A", "app.queue.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=7"]

  workers:
    container_name: penflow-workers
    image: ${WORKER_IMAGE:-penflow-worker:local}
    build:
      context: .
      dockerfile: docker/Dockerfile.workers
    user: root
    environment:
      ENVIRONMENT: local 
      DOCKER_NETWORK: penflow-network
      WORKER_IMAGE: ${WORKER_IMAGE:-penflow-worker:local}
      PHASE2_SCAN_CONCURRENCY: ${PHASE2_SCAN_CONCURRENCY:-3}
      BACKEND_API_URL: http://backend:3001/api/v1
      INTERNAL_WEBHOOK_SECRET: ${INTERNAL_WEBHOOK_SECRET:?INTERNAL_WEBHOOK_SECRET must be set in your .env file}
      BACKEND_URL: http://backend:3001
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_PROTOCOL: amqp
      DATABASE_SSL_MODE: disable
      DATABASE_URL: postgresql://penflow_runtime:${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB}
      URLSCAN_API_KEY: ${URLSCAN_API_KEY}
      SHODAN_API_KEY: ${SHODAN_API_KEY}
      SCREENSHOT_OUTPUT_DIR: /app/generated_reports/screenshots
      SCAN_MODE: LIVE
      REPORT_STORAGE: ${REPORT_STORAGE:-local}
      REPORT_OUTPUT_DIR: ${REPORT_OUTPUT_DIR:-/app/generated_reports}
      REPORT_S3_BUCKET: ${REPORT_S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-af-south-1}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - report-files:/app/generated_reports
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - penflow-network


  email-worker:
    container_name: penflow-email-worker
    image: ${BACKEND_IMAGE:-penflow-backend:local}
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command:
      [
        "celery",
        "-A",
        "app.queue.celery_app:celery_app",
        "worker",
        "--loglevel=info",
        "--queues=email",
        "--concurrency=2"
      ]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_PROTOCOL: amqp

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}

      REPORT_STORAGE: ${REPORT_STORAGE:-local}
      REPORT_OUTPUT_DIR: ${REPORT_OUTPUT_DIR:-/app/generated_reports}
      REPORT_S3_BUCKET: ${REPORT_S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-af-south-1}
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - report-files:/app/generated_reports
    restart: unless-stopped
    networks:
      - penflow-network

  schedule-worker:
    container_name: penflow-schedule-worker
    image: ${BACKEND_IMAGE:-penflow-backend:local}
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command:
      [
        "celery",
        "-A",
        "app.queue.celery_app:celery_app",
        "worker",
        "--loglevel=info",
        "--queues=schedules",
        "--concurrency=1"
      ]
    environment:
      DATABASE_URL: postgresql://penflow_runtime:${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_PROTOCOL: amqp
      DATABASE_SSL_MODE: disable
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - penflow-network

  celery-beat:
    container_name: penflow-celery-beat
    image: ${BACKEND_IMAGE:-penflow-backend:local}
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command:
      [
        "celery",
        "-A",
        "app.queue.celery_app:celery_app",
        "beat",
        "--loglevel=info",
        "--schedule=/tmp/celerybeat-schedule"
      ]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_PROTOCOL: amqp
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - penflow-network

  rabbitmq:
    container_name: penflow-rabbitmq
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - penflow-network

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - penflow-network

  postgres:
    container_name: penflow-postgres
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}
    volumes:
      - penflow-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - penflow-network

  postgres-test:
    profiles: ["test"]
    container_name: penflow-postgres-test
    image: pgvector/pgvector:pg16
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_TEST_USER} -d ${POSTGRES_TEST_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD}
      POSTGRES_DB: ${POSTGRES_TEST_DB}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    restart: "no"
    networks:
      - penflow-network

  keycloak-db:
    image: postgres:15
    container_name: penflow-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - penflow-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: penflow-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME: admin
      KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_PROVISIONER_CLIENT_SECRET: ${KEYCLOAK_PROVISIONER_CLIENT_SECRET}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./docker/keycloak/penflow-realm.json:/opt/keycloak/data/import/penflow-realm.json:ro
      - ./docker/keycloak/themes:/opt/keycloak/themes:ro
    command:
      - start-dev
      - --import-realm
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - penflow-network

  clamav:
    image: clamav/clamav:1.4
    environment:
      TZ: Etc/UTC
      FRESHCLAM_CHECKS: "12"
      CLAMD_CONF_StreamMaxLength: "11M"
      CLAMD_CONF_MaxFileSize: "20M"
      CLAMD_CONF_MaxScanSize: "50M"
      CLAMD_CONF_MaxScanTime: "30000"
      CLAMD_CONF_MaxThreads: "2"
      CLAMD_CONF_MaxQueue: "4"
      CLAMD_CONF_AlertExceedsMax: "yes"
      CLAMD_CONF_AlertEncrypted: "yes"
    volumes:
      - clamav-data:/var/lib/clamav
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    restart: unless-stopped
    networks:
      - penflow-network

  evidence-worker:
    image: ${BACKEND_IMAGE:-penflow-backend:local}
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command:
      [
        "celery",
        "-A",
        "app.queue.celery_app:celery_app",
        "worker",
        "--loglevel=info",
        "--queues=evidence",
        "--concurrency=1",
        "--prefetch-multiplier=1"
      ]
    environment:
      DATABASE_URL: postgresql://penflow_runtime:${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_PROTOCOL: amqp
      DATABASE_SSL_MODE: disable
      EVIDENCE_STORAGE: local
      EVIDENCE_STORAGE_DIR: /tmp/penflow-evidence
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
    volumes:
      - evidence-files:/tmp/penflow-evidence
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - penflow-network

networks:
  penflow-network:
    driver: bridge
    name: penflow-network

volumes:
  penflow-postgres-data:
  keycloak-postgres-data:
  report-files:
  report-files-test:
  evidence-files:
  clamav-data: