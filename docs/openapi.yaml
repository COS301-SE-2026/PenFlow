openapi: 3.1.0
info:
  title: PenFlow API
  description: Core backend API for the PenFlow platform.
  version: 1.0.0
paths:
  /api/v1/health:
    get:
      tags:
      - System
      summary: Health Check
      description: Infrastructure health check endpoint for Render/Docker.
      operationId: health_check_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Health Check Api V1 Health Get
  /api/v1/scans/:
    get:
      tags:
      - Scans
      summary: List Scans
      operationId: list_scans_api_v1_scans__get
      security:
      - HTTPBearer: []
      parameters:
      - name: scan_status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ScanStatus'
          - type: 'null'
          title: Scan Status
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 10
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScanHistoryItem'
                title: Response List Scans Api V1 Scans  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Scans
      summary: Initiate Ctem Scan
      operationId: initiate_ctem_scan_api_v1_scans__post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiateScanRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitiateScanResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/scans/{scan_id}/status:
    get:
      tags:
      - Scans
      summary: Get Scan Status
      operationId: get_scan_status_api_v1_scans__scan_id__status_get
      security:
      - HTTPBearer: []
      parameters:
      - name: scan_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Scan Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Scan Status Api V1 Scans  Scan Id  Status Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/scans/{scan_id}/pdf:
    get:
      tags:
      - Scans
      summary: Download Scan Pdf
      operationId: download_scan_pdf_api_v1_scans__scan_id__pdf_get
      parameters:
      - name: scan_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Scan Id
      responses:
        '200':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/scans/{scan_id}/email-report:
    post:
      tags:
      - Scans
      summary: Email Scan Report
      operationId: email_scan_report_api_v1_scans__scan_id__email_report_post
      parameters:
      - name: scan_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Scan Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailReportRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Email Scan Report Api V1 Scans  Scan Id  Email Report
                  Post
        '400':
          description: Report is not ready yet
        '404':
          description: Scan not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/scans/{scan_id}/metrics:
    get:
      tags:
      - Scans
      summary: Get Scan Metrics
      description: 'Returns aggregated metrics for Risk Score, Findings,

        Assets, Services, Technologies.'
      operationId: get_scan_metrics_api_v1_scans__scan_id__metrics_get
      parameters:
      - name: scan_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Scan Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/scans/{scan_id}/findings:
    get:
      tags:
      - Scans
      summary: Get Scan Findings
      description: Retrieves detailed findings for a scan, ordered by highest risk.
      operationId: get_scan_findings_api_v1_scans__scan_id__findings_get
      parameters:
      - name: scan_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Scan Id
      - name: severity
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by severity
          title: Severity
        description: Filter by severity
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 10
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DashboardFindingItem'
                title: Response Get Scan Findings Api V1 Scans  Scan Id  Findings
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/scans/{scan_id}/assets:
    get:
      tags:
      - Scans
      summary: Get Scan Assets
      description: Retrieves discovered assets along with their associated finding
        counts.
      operationId: get_scan_assets_api_v1_scans__scan_id__assets_get
      parameters:
      - name: scan_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Scan Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 10
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DashboardAssetItem'
                title: Response Get Scan Assets Api V1 Scans  Scan Id  Assets Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/scans/{scan_id}/risk-history:
    get:
      tags:
      - Scans
      summary: Get Scan Risk History
      description: Retrieves historical risk scores for the domain to render the risk
        over time graph.
      operationId: get_scan_risk_history_api_v1_scans__scan_id__risk_history_get
      parameters:
      - name: scan_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Scan Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RiskHistoryItem'
                title: Response Get Scan Risk History Api V1 Scans  Scan Id  Risk
                  History Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/scans/{scan_id}/findings-page:
    get:
      tags:
      - Scans
      summary: Get Scan Findings Page
      description: 'Provides full card grid data for the Findings tab, including top
        metric counts

        and side drawer attributes.'
      operationId: get_scan_findings_page_api_v1_scans__scan_id__findings_page_get
      parameters:
      - name: scan_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Scan Id
      - name: severity
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by severity category
          title: Severity
        description: Filter by severity category
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search query string
          title: Search
        description: Search query string
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
          description: Sort criteria (severity, cvss, newest)
          default: severity
          title: Sort By
        description: Sort criteria (severity, cvss, newest)
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 12
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/app__schemas__scan__FindingListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/scans/{scan_id}/services-page:
    get:
      tags:
      - Scans
      summary: Get Scan Services Page
      description: Provides full table data and summary cards for the Services tab.
      operationId: get_scan_services_page_api_v1_scans__scan_id__services_page_get
      parameters:
      - name: scan_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Scan Id
      - name: protocol
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by protocol, TCP/UDP
          title: Protocol
        description: Filter by protocol, TCP/UDP
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search query string
          title: Search
        description: Search query string
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
          description: Sort criteria
          default: open
          title: Sort By
        description: Sort criteria
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 15
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/scans/{scan_id}/assets-page:
    get:
      tags:
      - Scans
      summary: Get Scan Assets Page
      description: Provides full table data and summary category cards for the assets
        tab.
      operationId: get_scan_assets_page_api_v1_scans__scan_id__assets_page_get
      parameters:
      - name: scan_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Scan Id
      - name: asset_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by asset type (Domain, subdomain, ip)
          title: Asset Type
        description: Filter by asset type (Domain, subdomain, ip)
      - name: severity
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by highest severity
          title: Severity
        description: Filter by highest severity
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search by query string
          title: Search
        description: Search by query string
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
          description: Sort criteria (risk, findings, identifier)
          default: risk
          title: Sort By
        description: Sort criteria (risk, findings, identifier)
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 15
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/internal/scans/{scan_id}/status:
    patch:
      tags:
      - Internal Webhooks
      summary: Update Scan Status Callback
      operationId: update_scan_status_callback_api_v1_internal_scans__scan_id__status_patch
      parameters:
      - name: scan_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Scan Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanCallbackRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Update Scan Status Callback Api V1 Internal Scans  Scan
                  Id  Status Patch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/internal/reports/{scan_id}/status:
    patch:
      tags:
      - Internal Webhooks
      summary: Update Report Status Callback
      operationId: update_report_status_callback_api_v1_internal_reports__scan_id__status_patch
      parameters:
      - name: scan_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Scan Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCallbackRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Update Report Status Callback Api V1 Internal Reports  Scan
                  Id  Status Patch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/internal/scans/{scan_id}/sources/{source_name}:
    patch:
      tags:
      - Internal Webhooks
      summary: Update Scan Source Callback
      operationId: update_scan_source_callback_api_v1_internal_scans__scan_id__sources__source_name__patch
      parameters:
      - name: scan_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Scan Id
      - name: source_name
        in: path
        required: true
        schema:
          type: string
          title: Source Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanSourceCallbackRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Update Scan Source Callback Api V1 Internal Scans  Scan
                  Id  Sources  Source Name  Patch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/internal/reports/engagement/{engagement_id}/version/{version}/callback:
    put:
      tags:
      - Internal Webhooks
      summary: Update Engagement Report Status Callback
      operationId: update_engagement_report_status_callback_api_v1_internal_reports_engagement__engagement_id__version__version__callback_put
      parameters:
      - name: engagement_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Engagement Id
      - name: version
        in: path
        required: true
        schema:
          type: integer
          title: Version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCallbackRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Update Engagement Report Status Callback Api V1 Internal
                  Reports Engagement  Engagement Id  Version  Version  Callback Put
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users/me:
    get:
      tags:
      - Users
      summary: Provision User
      operationId: provision_user_api_v1_users_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Provision User Api V1 Users Me Get
      security:
      - HTTPBearer: []
  /api/v1/scans/{scan_id}/summary:
    get:
      tags:
      - Executive Summary
      summary: Get Scan Summary
      description: 'Generates the complete Executive Summary for a specific scan.

        Currently compiled blocks:

        - Block 1: Scan Summary

        - Block 2: Risk Snapshot

        - Block 3: Top Findings Preview'
      operationId: get_scan_summary_api_v1_scans__scan_id__summary_get
      parameters:
      - name: scan_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Scan Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutiveSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/domains/:
    post:
      tags:
      - Domain Verification
      summary: Add Domain For Verification
      operationId: add_domain_for_verification_api_v1_domains__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDomainRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifiedDomainResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/domains/{domain_id}/verify:
    post:
      tags:
      - Domain Verification
      summary: Verify Domain Ownership
      operationId: verify_domain_ownership_api_v1_domains__domain_id__verify_post
      security:
      - HTTPBearer: []
      parameters:
      - name: domain_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Domain Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifiedDomainResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/domains:
    get:
      tags:
      - Domain Verification
      summary: Get Domains
      operationId: get_domains_api_v1_domains_get
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/DomainVerificationStatus'
          - type: 'null'
          title: Status
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Search
      - name: sort
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/DomainSortField'
          default: created_at
      - name: order
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SortOrder'
          default: desc
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/domains/{domain_id}:
    delete:
      tags:
      - Domain Verification
      summary: Delete Domain
      operationId: delete_domain_api_v1_domains__domain_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: domain_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Domain Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/engagements/:
    post:
      tags:
      - Engagements
      summary: Create client engagement request
      operationId: create_engagement_request_api_v1_engagements__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EngagementCreateRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngagementCreateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/engagements:
    get:
      tags:
      - Engagements
      summary: List engagements for user
      operationId: get_engagements_api_v1_engagements_get
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/EngagementStatus'
          - type: 'null'
          title: Status
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Search
      - name: sort
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/EngagementSortField'
          default: updated_at
      - name: order
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SortOrder'
          default: desc
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
