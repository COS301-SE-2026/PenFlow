name: PenFlow Production Deployment

on:
  workflow_run:
    workflows: ["PenFlow CI"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing tested ECR image tag to deploy"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: penflow-production
  cancel-in-progress: false

env:
  AWS_REGION: af-south-1
  AWS_ACCOUNT_ID: "428792079342"

  ECS_CLUSTER: penflow-production-cluster

  BACKEND_SERVICE: penflow-production-backend-service
  BACKEND_CONTAINER: penflow-backend
  BACKEND_ECR_REPOSITORY: penflow-production-backend

  FRONTEND_SERVICE: penflow-production-frontend-service
  FRONTEND_CONTAINER: penflow-frontend
  FRONTEND_ECR_REPOSITORY: penflow-production-frontend

  WORKER_SERVICE: penflow-production-worker-service
  WORKER_CONTAINER: penflow-worker
  WORKER_ECR_REPOSITORY: penflow-production-worker

jobs:
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 30

    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )

    steps:
      - name: Resolve deployment
        id: deploy
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            SHA="$WORKFLOW_SHA"
            echo "tag=${SHA:0:12}" >> "$GITHUB_OUTPUT"
            echo "ref=$SHA" >> "$GITHUB_OUTPUT"
          else
            if [[ ! "$INPUT_IMAGE_TAG" =~ ^[0-9a-f]{12}$ ]]; then
              echo "Invalid image tag: expected a 12-character Git commit SHA"
              exit 1
            fi
            echo "tag=$INPUT_IMAGE_TAG" >> "$GITHUB_OUTPUT"
          fi


      - name: Checkout deployment scripts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ steps.deploy.outputs.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
 

      - name: Deploy backend
        shell: bash        
        env: 
          IMAGE_TAG: ${{ steps.deploy.outputs.tag }}
        run: |
          IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BACKEND_ECR_REPOSITORY:$IMAGE_TAG"

          ./scripts/deploy-ecs-service.sh \
            "$ECS_CLUSTER" \
            "$BACKEND_SERVICE" \
            "$BACKEND_CONTAINER" \
            "$IMAGE"


      - name: Deploy worker
        shell: bash        
        env: 
          IMAGE_TAG: ${{ steps.deploy.outputs.tag }}
        run: |
          IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$WORKER_ECR_REPOSITORY:$IMAGE_TAG"

          ./scripts/deploy-ecs-service.sh \
            "$ECS_CLUSTER" \
            "$WORKER_SERVICE" \
            "$WORKER_CONTAINER" \
            "$IMAGE"


      - name: Deploy frontend
        shell: bash        
        env: 
          IMAGE_TAG: ${{ steps.deploy.outputs.tag }}
        run: |
          IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$FRONTEND_ECR_REPOSITORY:$IMAGE_TAG"

          ./scripts/deploy-ecs-service.sh \
            "$ECS_CLUSTER" \
            "$FRONTEND_SERVICE" \
            "$FRONTEND_CONTAINER" \
            "$IMAGE"


      - name: Production smoke tests
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 5 \
            https://pen-flow.com/api/v1/health

          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 5 \
            https://pen-flow.com/health

          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 5 \
            https://auth.pen-flow.com/realms/penflow/.well-known/openid-configuration

          echo ""
          echo "Production smoke tests passed"
              