# Remember to add health checks plus ensure run time compatibility for things such as e2e/integration tests
# Also codecov

name: PenFlow CI

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Frontend
        run: pnpm --filter penflow-frontend lint

      - name: Type Check Frontend
        run: pnpm --filter penflow-frontend type-check

      - name: Test Frontend
        run: pnpm --filter penflow-frontend test

      - name: Build Frontend
        run: pnpm --filter penflow-frontend build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Compile Backend
        run: python -m compileall app

      - name: Type Check Backend
        run: mypy app

      - name: Lint Backend
        run: ruff check app

      - name: Test Backend
        run: pytest

  workers:
    name: Workers
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: workers

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Compile Workers
        run: python -m compileall app

      - name: Type Check Workers
        run: mypy app

      - name: Lint Workers
        run: ruff check app

      - name: Test Workers
        run: pytest

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [frontend, backend, workers]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Images
        run: docker compose build