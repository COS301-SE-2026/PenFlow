name: PenFlow CI

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

env:
  NODE_VERSION: "20.x"
  PNPM_VERSION: "10.33.2"
  PYTHON_VERSION: "3.12"

  POSTGRES_USER: ${{ secrets.CI_POSTGRES_USER }}
  POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
  POSTGRES_DB: penflow

  POSTGRES_TEST_USER: ${{ secrets.CI_POSTGRES_USER }}
  POSTGRES_TEST_PASSWORD: ${{ secrets.CI_POSTGRES_TEST_PASSWORD }}
  POSTGRES_TEST_DB: penflow_test

  KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.CI_KEYCLOAK_ADMIN_PASSWORD }}

  SMTP_HOST: localhost
  SMTP_PORT: "1025"
  SMTP_USER: test
  SMTP_PASSWORD: ${{ secrets.CI_SMTP_PASSWORD }}
  SMTP_FROM: test@penflow.local

  KEYCLOAK_CLIENT_SECRET: ${{ secrets.CI_KEYCLOAK_CLIENT_SECRET}}

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Frontend
        run: pnpm --filter penflow-frontend lint

      - name: Type Check Frontend
        run: pnpm --filter penflow-frontend type-check

      - name: Test Frontend
        run: pnpm --filter penflow-frontend test

      - name: Build Frontend
        run: pnpm --filter penflow-frontend build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system -r requirements-dev.txt

      - name: Compile Backend
        run: python -m compileall app

      - name: Type Check Backend
        run: mypy app

      - name: Lint Backend
        run: ruff check app tests

      - name: Run Backend Unit Tests
        env:
          DATABASE_URL: postgresql+asyncpg://${{ secrets.CI_POSTGRES_USER }}:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/penflow_test
          RABBITMQ_PROTOCOL: amqp
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: "5672"
          RABBITMQ_USERNAME: guest
          RABBITMQ_PASSWORD: guest
        run: |
          PYTHONPATH=. pytest tests/unit --cov=app --cov-report=xml

      - name: Upload Backend Coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: true

  workers:
    name: Workers
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: workers

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system -r requirements-dev.txt

      - name: Compile Workers
        run: python -m compileall app

      - name: Type Check Workers
        run: mypy app

      - name: Lint Workers
        run: ruff check app tests

      - name: Run Worker Unit Tests
        env:
          DATABASE_URL: postgresql+asyncpg://${{ secrets.CI_POSTGRES_USER }}:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/penflow_test
          BACKEND_URL: http://localhost:3001
          RABBITMQ_PROTOCOL: amqp
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: "5672"
          RABBITMQ_USERNAME: guest
          RABBITMQ_PASSWORD: guest
        run: |
          PYTHONPATH=. pytest tests/unit --cov=app --cov-report=xml

      - name: Upload Worker Coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          files: workers/coverage.xml
          flags: workers
          fail_ci_if_error: true

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend, backend, workers]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Build Docker images
        run: docker compose build

  system-integration:
    name: System Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [docker-build]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Build Test Images
        run: |
          docker compose --profile test build \
            backend-test \
            workers-test

      - name: Start Integration Services
        run: |
          docker compose --profile test up -d \
            postgres-test \
            rabbitmq \
            workers-test

      - name: RabbitMQ Health Check
        run: |
          for i in {1..20}; do
            docker compose ps
            docker compose exec rabbitmq rabbitmq-diagnostics ping && exit 0
            sleep 3
          done

          docker compose logs rabbitmq
          exit 1

      - name: Run Backend Integration Tests
        run: |
          docker compose --profile test run --rm \
          -v "${{ github.workspace }}/backend:/coverage-output" \
            backend-test \
            pytest tests/integration \
            --cov=app \
            --cov-report=xml:/coverage-output/coverage-integration.xml

      - name: Upload Backend Integration Coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          files: backend/coverage-integration.xml
          flags: backend
          fail_ci_if_error: true

      - name: Run Worker Integration Tests
        run: |
          docker compose --profile test run --rm \
          -v "${{ github.workspace }}/workers:/coverage-output" \
            workers-test \
            pytest tests/integration \
            --cov=app \
            --cov-report=xml:/coverage-output/coverage-integration.xml

      - name: Upload Worker Integration Coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          files: workers/coverage-integration.xml
          flags: workers
          fail_ci_if_error: true

      - name: Show Docker Logs on Failure
        if: failure()
        run: docker compose logs

      - name: Stop Integration Services
        if: always()
        run: docker compose down -v --remove-orphans

  docker-health:
    name: Docker Health Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [docker-build]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Start Full Docker Stack
        run: docker compose up -d --build

      - name: Check Backend Health
        run: |
          for i in {1..20}; do
            curl -f http://localhost:3001/api/v1/health && exit 0
            sleep 3
          done

          docker compose logs backend
          exit 1

      - name: Check Frontend Responds
        run: |
          for i in {1..20}; do
            curl -f http://localhost:3000 && exit 0
            sleep 3
          done

          docker compose logs frontend
          exit 1

      - name: Show Docker Logs on Failure
        if: failure()
        run: docker compose logs

      - name: Stop Docker stack
        if: always()
        run: docker compose down -v --remove-orphans