name: PenFlow CI

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

permissions:
  contents: read

env:
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  SEMGREP_IMAGE: semgrep/semgrep:1.181.0@sha256:81474464c1f07483ba0682a44787fd93c91397419762a04abe2bafaae396304b
  TRIVY_IMAGE: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222

  GUEST_SCAN_TOKEN_SECRET: "ci-only-guest-token-secret-never-use-in-production"
  INTERNAL_WEBHOOK_SECRET: "ci-only-internal-webhook-secret-never-use-in-production"

  NODE_VERSION: "20.x"
  PNPM_VERSION: "10.33.2"
  PYTHON_VERSION: "3.12"

  POSTGRES_USER: ${{ secrets.CI_POSTGRES_USER }}
  POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
  POSTGRES_DB: penflow

  POSTGRES_TEST_USER: ${{ secrets.CI_POSTGRES_USER }}
  POSTGRES_TEST_PASSWORD: ${{ secrets.CI_POSTGRES_TEST_PASSWORD }}
  POSTGRES_TEST_DB: penflow_test

  KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.CI_KEYCLOAK_ADMIN_PASSWORD }}

  SMTP_HOST: localhost
  SMTP_PORT: "1025"
  SMTP_USER: test
  SMTP_PASSWORD: ${{ secrets.CI_SMTP_PASSWORD }}
  SMTP_FROM: test@penflow.local

  KEYCLOAK_CLIENT_SECRET: ${{ secrets.CI_KEYCLOAK_CLIENT_SECRET}}

  AWS_REGION: eu-north-1
  AWS_ACCOUNT_ID: "491449495014"

  BACKEND_ECR_REPOSITORY: penflow-production-backend
  FRONTEND_ECR_REPOSITORY: penflow-production-frontend
  WORKER_ECR_REPOSITORY: penflow-production-worker

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: ${{ env.PNPM_VERSION }}


      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"


      - name: Install Dependencies
        run: pnpm install --frozen-lockfile


      - name: Audit frontend dependencies
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/security-frontend"

          pnpm audit \
            --audit-level high \
            --json \
            > "$RUNNER_TEMP/security-frontend/pnpm-audit.json"

      - name: Upload frontend dependency report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-frontend-dependencies
          path: ${{ runner.temp }}/security-frontend/pnpm-audit.json
          if-no-files-found: warn
          retention-days: 7


      - name: Lint Frontend
        run: pnpm --filter penflow-frontend lint


      - name: Type Check Frontend
        run: pnpm --filter penflow-frontend type-check


      - name: Test Frontend
        run: pnpm --filter penflow-frontend test


      - name: Build Frontend
        run: pnpm --filter penflow-frontend build

  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          enable-cache: true


      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}


      - name: Install Dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system -r requirements-dev.txt

      - name: Audit installed Python dependencies
        shell: bash
        run: bash "$GITHUB_WORKSPACE/scripts/audit-python.sh"


      - name: Upload Python dependency report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-${{ github.job }}-dependencies
          path: ${{ runner.temp }}/security-${{ github.job }}/pip-audit.json
          if-no-files-found: warn
          retention-days: 7


      - name: Compile Backend
        run: python -m compileall app


      - name: Type Check Backend
        run: mypy app


      - name: Lint Backend
        run: ruff check app tests


      - name: Run Backend Unit Tests
        env:
          DATABASE_URL: postgresql+asyncpg://${{ secrets.CI_POSTGRES_USER }}:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/penflow_test
          RABBITMQ_PROTOCOL: amqp
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: "5672"
          RABBITMQ_USERNAME: guest
          RABBITMQ_PASSWORD: guest
          APP_ENV: test
          RATE_LIMIT_STORAGE_URI: memory://
          RATE_LIMIT_TEST_REDIS_URL: redis://localhost:6379/15
        run: |
          PYTHONPATH=. pytest tests/unit --cov=app --cov-report=xml


      - name: Upload Backend Coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: true

  workers:
    name: Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: workers

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          enable-cache: true


      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}


      - name: Install Dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system -r requirements-dev.txt

      - name: Audit installed Python dependencies
        shell: bash
        run: bash "$GITHUB_WORKSPACE/scripts/audit-python.sh"


      - name: Upload Python dependency report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-${{ github.job }}-dependencies
          path: ${{ runner.temp }}/security-${{ github.job }}/pip-audit.json
          if-no-files-found: warn
          retention-days: 7


      - name: Compile Workers
        run: python -m compileall app


      - name: Type Check Workers
        run: mypy app


      - name: Lint Workers
        run: ruff check app tests


      - name: Run Worker Unit Tests
        env:
          DATABASE_URL: postgresql+asyncpg://${{ secrets.CI_POSTGRES_USER }}:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/penflow_test
          BACKEND_URL: http://localhost:3001
          RABBITMQ_PROTOCOL: amqp
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: "5672"
          RABBITMQ_USERNAME: guest
          RABBITMQ_PASSWORD: guest
        run: |
          PYTHONPATH=. pytest tests/unit --cov=app --cov-report=xml


      - name: Upload Worker Coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          files: workers/coverage.xml
          flags: workers
          fail_ci_if_error: true

  security:
    name: Security (${{ matrix.check }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        check: [secrets, sast]

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare report directory
        run: mkdir -p "$RUNNER_TEMP/security-${{ matrix.check }}"

      - name: Scan Git history for secrets
        if: matrix.check == 'secrets'
        shell: bash
        run: |
          status=0

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$RUNNER_TEMP/security-secrets:/reports" \
            -w /repo \
            "$GITLEAKS_IMAGE" git \
            --log-opts="--all" \
            --redact=100 \
            --ignore-gitleaks-allow \
            --exit-code 10 \
            --report-format json \
            --report-path /reports/gitleaks.json \
            /repo || status=$?

          case "$status" in
            0)
              echo "No secrets detected"
              ;;
            10)
              echo "::error::Gitleaks detected secrets; review the redacted report"
              ;;
            *)
              echo "::error::Gitleaks could not complete the scan"
              ;;
          esac

          exit "$status"

      - name: Static security analysis
        if: matrix.check == 'sast'
        shell: bash
        run: |
          status=0

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$RUNNER_TEMP/security-sast:/reports" \
            -w /src \
            "$SEMGREP_IMAGE" \
            semgrep scan \
            --config p/ci \
            --metrics off \
            --strict \
            --error \
            --json \
            --output /reports/semgrep.json \
            backend/app \
            workers/app \
            frontend/src || status=$?

          case "$status" in
            0)
              echo "No blocking static-analysis findings"
              ;;
            1)
              echo "::error::Semgrep found security issues"
              ;;
            *)
              echo "::error::Semgrep could not complete the analysis"
              ;;
          esac

          exit "$status"

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-${{ matrix.check }}
          path: ${{ runner.temp }}/security-${{ matrix.check }}/*.json
          if-no-files-found: warn
          retention-days: 7


  docker-verify:
    name: Docker Verification
    runs-on: ubuntu-latest
    timeout-minutes: 45

    needs: [frontend, backend, workers, security]
    permissions: 
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Resolve Image Tag
        id: image
        shell: bash
        run: |
          IMAGE_TAG="${GITHUB_SHA:0:12}"

          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Commit: $GITHUB_SHA"
          echo "Image tag: $IMAGE_TAG"


      - name: Build Production Images
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          docker build \
            -f docker/Dockerfile.backend \
            -t "penflow-backend:$IMAGE_TAG" \
            .

          docker build \
            -f docker/Dockerfile.workers \
            -t "penflow-worker:$IMAGE_TAG" \
            .

          docker build \
            -f docker/Dockerfile.frontend \
            -t "penflow-frontend:$IMAGE_TAG" \
            .

          echo ""
          echo "Production images built:"
          docker image ls | grep penflow


      - name: Scan production images
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: bash scripts/scan-production-images.sh

      - name: Upload production image security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-production-images
          path: ${{ runner.temp }}/security-images/*.json
          if-no-files-found: warn
          retention-days: 7


      - name: Build Test Images
        run: |
          docker compose --profile test build \
            backend-test \
            workers-test


      - name: Start Integration Services
        run: |
          docker compose --profile test up -d \
            postgres-test \
            rabbitmq \
            workers-test


      - name: RabbitMQ Health Check
        run: |
          for i in {1..20}; do
            docker compose ps
            docker compose exec rabbitmq rabbitmq-diagnostics ping && exit 0
            sleep 3
          done

          docker compose logs rabbitmq
          exit 1


      - name: Run Backend Integration Tests
        run: |
          mkdir -p coverage/backend
          chmod 777 coverage/backend

          docker compose --profile test run --rm \
            -v "${{ github.workspace }}/coverage/backend:/coverage-output" \
            backend-test \
            pytest tests/integration \
            --cov=app \
            --cov-report=xml:/coverage-output/coverage-integration.xml


      - name: Upload Backend Integration Coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          files: coverage/backend/coverage-integration.xml
          flags: backend
          fail_ci_if_error: true


      - name: Run Worker Integration Tests
        run: |
          mkdir -p coverage/workers
          chmod 777 coverage/workers

          docker compose --profile test run --rm \
            -v "${{ github.workspace }}/coverage/workers:/coverage-output" \
            workers-test \
            pytest tests/integration \
            --cov=app \
            --cov-report=xml:/coverage-output/coverage-integration.xml


      - name: Upload Worker Integration Coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          files: coverage/workers/coverage-integration.xml
          flags: workers
          fail_ci_if_error: true


      - name: Stop Integration Services
        if: always()
        run: docker compose --profile test down -v --remove-orphans


      - name: Start Full Stack with Production Images
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          BACKEND_IMAGE: penflow-backend:${{ steps.image.outputs.tag }}
          FRONTEND_IMAGE: penflow-frontend:${{ steps.image.outputs.tag }}
          WORKER_IMAGE: penflow-worker:${{ steps.image.outputs.tag }}
        run:  docker compose up -d --no-build


      - name: Check Backend Health
        shell: bash
        run: |
          for i in {1..20}; do
            if curl --fail --silent --show-error \
              http://localhost:3001/api/v1/health; then

              echo ""
              echo "Backend is healthy"
              exit 0
            fi

            echo "Waiting for backend..."
            sleep 3
          done

          echo "Backend failed health check"
          docker compose logs backend
          exit 1


      - name: Check Frontend Health
        shell: bash
        run: |
          for i in {1..20}; do
            if curl --fail --silent --show-error \
              http://localhost:3000; then

              echo ""
              echo "Frontend is healthy"
              exit 0
            fi

            echo "Waiting for frontend..."
            sleep 3
          done

          echo "Frontend failed health check"
          docker compose logs frontend
          exit 1


      - name: Show Docker Logs on Failure
        if: failure()
        run: docker compose logs

      - name: Stop Docker stack
        if: always()
        run: docker compose down -v --remove-orphans


      - name: Show Tested Image IDs
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          echo "Backend:"
          docker image inspect \
            "penflow-backend:$IMAGE_TAG" \
            --format='{{.Id}}'

          echo "Worker:"
          docker image inspect \
            "penflow-worker:$IMAGE_TAG" \
            --format='{{.Id}}'

          echo "Frontend:"
          docker image inspect \
            "penflow-frontend:$IMAGE_TAG" \
            --format='{{.Id}}'


      - name: Configure AWS Credentials
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "491449495014"


      - name: Verify AWS Identity
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        run: aws sts get-caller-identity


      - name: Login to Amazon ECR
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        shell: bash
        run: |
          aws ecr get-login-password \
            --region "$AWS_REGION" |
          docker login \
            --username AWS \
            --password-stdin \
            "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"


      - name: Tag Tested Images for ECR
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

          docker tag \
            "penflow-backend:$IMAGE_TAG" \
            "$REGISTRY/$BACKEND_ECR_REPOSITORY:$IMAGE_TAG"

          docker tag \
            "penflow-worker:$IMAGE_TAG" \
            "$REGISTRY/$WORKER_ECR_REPOSITORY:$IMAGE_TAG"

          docker tag \
            "penflow-frontend:$IMAGE_TAG" \
            "$REGISTRY/$FRONTEND_ECR_REPOSITORY:$IMAGE_TAG"


      - name: Push Tested Images to ECR
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

          docker push \
            "$REGISTRY/$BACKEND_ECR_REPOSITORY:$IMAGE_TAG"

          docker push \
            "$REGISTRY/$WORKER_ECR_REPOSITORY:$IMAGE_TAG"

          docker push \
            "$REGISTRY/$FRONTEND_ECR_REPOSITORY:$IMAGE_TAG"

          echo ""
          echo "Tested production images published."
          echo "Tag: $IMAGE_TAG"


      - name: Show Docker Logs on Failure
        if: failure()
        run: docker compose logs


      - name: Stop Docker Stack
        if: always()
        run: docker compose down -v --remove-orphans
